name: Sync TV catalogue

on:
  schedule:
    # Weekly, Monday 04:17 UTC — off the hour to avoid the CI rush.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rebuild public/tv from Free-TV/IPTV
        run: pnpm sync:tv
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if the catalogue changed
        run: |
          git add -A public/tv
          if git diff --cached --quiet; then
            echo "Catalogue unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh TV catalogue from Free-TV/IPTV"
          git push
