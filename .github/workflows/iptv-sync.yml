name: Sync IPTV catalogue

on:
  schedule:
    # Weekly, Monday 04:17 UTC — off the hour to avoid the CI rush.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rebuild public/iptv.json from iptv-org
        run: pnpm run sync:iptv
      - name: Commit if the catalogue changed
        run: |
          if git diff --quiet -- public/iptv.json; then
            echo "Catalogue unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/iptv.json
          git commit -m "Refresh IPTV catalogue from iptv-org"
          git push
